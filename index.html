<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mining Pool">
  <meta name="theme-color" content="#131f33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mining Pool</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/all.min.css">
  <link rel="stylesheet" href="assets/css/pool.css">
</head>
<body>

  <!-- ── NAVBAR ─────────────────────────────────────────────────── -->
  <nav class="navbar mp-navbar sticky-top">
    <div class="container-xl d-flex align-items-center justify-content-between gap-2 flex-wrap">

      <!-- Brand -->
      <a class="mp-brand" href="#">
        <i class="fa-solid fa-cube"></i>
        <span>MiningCore</span>
        <span class="mp-brand-sub">Pool</span>
        <span class="mp-ws-dot" id="ws-dot" title="WebSocket"></span>
      </a>

      <!-- Controls -->
      <div class="d-flex align-items-center gap-2 flex-wrap">

        <!-- Pool selector -->
        <div class="mp-pool-wrap">
          <i class="fa-solid fa-layer-group mp-pool-icon"></i>
          <select class="mp-pool-select" id="pool-select" aria-label="Select pool">
            <option value="" data-tkey="nav.select-pool">— select pool —</option>
          </select>
        </div>

        <!-- Language -->
        <select class="mp-lang-select" id="lang-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>

        <!-- Theme -->
        <div class="dropdown">
          <button class="mp-theme-btn dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-circle-half-stroke" id="theme-icon"></i>
            <span id="theme-label" data-tkey="theme.auto">Auto</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end mp-theme-menu">
            <li>
              <button class="dropdown-item" type="button" data-theme="light"
                      data-tkey="theme.light">Light</button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-theme="dark"
                      data-tkey="theme.dark">Dark</button>
            </li>
            <li>
              <button class="dropdown-item" type="button" data-theme="auto"
                      data-tkey="theme.auto">Auto</button>
            </li>
          </ul>
        </div>

      </div><!-- /controls -->
    </div>
  </nav>

  <!-- ── CONNECTION BAR ─────────────────────────────────────────── -->
  <div class="mp-base-bar">
    <div class="container-xl">
      <div class="mp-base-inner">
        <span class="mp-base-label">
          <i class="fa-solid fa-plug"></i>API
        </span>
        <input type="url" id="base-url" class="mp-base-input"
               placeholder="https://pool.bitwebcore.net"
               autocomplete="off" spellcheck="false">
        <button type="button" id="apply-url" class="mp-base-btn">
          <i class="fa-solid fa-arrows-rotate"></i> Connect
        </button>
      </div>
    </div>
  </div>

  <!-- ── MAIN ───────────────────────────────────────────────────── -->
  <div class="container-xl py-3" id="tab-content-wrap">

    <!-- Tabs -->
    <ul class="nav mp-tabs mb-3" id="main-tabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link mp-tab active" type="button" role="tab"
                id="tab-overview"
                data-bs-toggle="tab" data-bs-target="#pane-overview"
                aria-controls="pane-overview" aria-selected="true">
          <i class="fa-solid fa-gauge-high"></i>
          <span data-tkey="tab.overview">Overview</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link mp-tab" type="button" role="tab"
                id="tab-blocks"
                data-bs-toggle="tab" data-bs-target="#pane-blocks"
                aria-controls="pane-blocks" aria-selected="false">
          <i class="fa-solid fa-cubes"></i>
          <span data-tkey="tab.blocks">Blocks</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link mp-tab" type="button" role="tab"
                id="tab-miners"
                data-bs-toggle="tab" data-bs-target="#pane-miners"
                aria-controls="pane-miners" aria-selected="false">
          <i class="fa-solid fa-hard-drive"></i>
          <span data-tkey="tab.miners">Miners</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link mp-tab" type="button" role="tab"
                id="tab-start"
                data-bs-toggle="tab" data-bs-target="#pane-start"
                aria-controls="pane-start" aria-selected="false">
          <i class="fa-solid fa-bolt"></i>
          <span data-tkey="tab.start">Start Mining</span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link mp-tab" type="button" role="tab"
                id="tab-myminer"
                data-bs-toggle="tab" data-bs-target="#pane-myminer"
                aria-controls="pane-myminer" aria-selected="false">
          <i class="fa-solid fa-circle-user"></i>
          <span data-tkey="tab.myminer">My Miner</span>
        </button>
      </li>
    </ul>

    <!-- Tab panes (content injected by pool.js) -->
    <div class="tab-content">
      <div class="tab-pane fade show active" id="pane-overview" role="tabpanel"
           aria-labelledby="tab-overview" tabindex="0"></div>
      <div class="tab-pane fade" id="pane-blocks" role="tabpanel"
           aria-labelledby="tab-blocks" tabindex="0"></div>
      <div class="tab-pane fade" id="pane-miners" role="tabpanel"
           aria-labelledby="tab-miners" tabindex="0"></div>
      <div class="tab-pane fade" id="pane-start" role="tabpanel"
           aria-labelledby="tab-start" tabindex="0"></div>
      <div class="tab-pane fade" id="pane-myminer" role="tabpanel"
           aria-labelledby="tab-myminer" tabindex="0"></div>
    </div>

  </div>

  <!-- ── TOASTS ─────────────────────────────────────────────────── -->
  <div class="mp-toasts" id="mp-toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- ── SCRIPTS ────────────────────────────────────────────────── -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/multilangpool.js"></script>
  <script src="assets/js/pool.js"></script>

</body>
</html>
